# Turbid Vision Probe dashboard proxy.
#
# The probe dashboard uses root-absolute HTTP and WebSocket paths, so it owns
# this dedicated listener instead of being mounted below the Pioreactor UI.
$SERVER["socket"] == "0.0.0.0:@@LISTEN_PORT@@" {
  proxy.header = (
    "upgrade" => "enable",
    # Replace any browser-facing Pioreactor Host value before sending the
    # request to the probe. This also prevents the probe's captive-portal
    # guard from redirecting proxied requests while its AP is enabled.
    "map-host-request" => ( "-" => "@@PROBE_HOST@@" ),
  )
  proxy.server = (
    "" => ( ( "host" => "@@PROBE_HOST@@", "port" => 80 ) ),
  )
}
